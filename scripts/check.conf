# scripts/check.conf — LeaveManager (Python 3.13 · Flask). Generated by bootstrap 2026-10-23.
# One step per line:  <name>: <command>  — runs in order, fails fast (docs/testing.md).
# Interpreter: the project venv (.venv/Scripts on Windows, .venv/bin elsewhere), else `python`
# on PATH (CI installs requirements-dev.txt into its own Python).
#
# Resource inventory (docs/testing.md, Resource hygiene):
#   exec-bits — tools/check_exec_bits.py: one `git ls-files` call, no daemon, writes nothing.
#   lint — ruff: single process, no daemon/server; leaves .ruff_cache  -> --no-cache.
#   test — pytest: in-process, no xdist workers, Flask test_client (no server, no port);
#          leaves .pytest_cache -> -p no:cacheprovider (pytest.ini); app data is in memory and
#          reset per test by seed() (rule 5). No e2e, no browser, no app-under-test process.
# Profiles: every step is quick, so both are [fast]; fast = full until a step exceeds ~1 min.
#
# exec-bits — spec 0002 (#5): shebang files committed 100644 break Linux CI (exit 126).
# resource hygiene: one short-lived git process, nothing written.
# GIT_CEILING_DIRECTORIES: judge only the project root's own repository, never one above it (CB-5).
exec-bits [fast]: for p in .venv/Scripts/python.exe .venv/bin/python; do [ -x "$p" ] && PY=$p && break; done; GIT_CEILING_DIRECTORIES="$(dirname "$PWD")" "${PY:-python}" tools/check_exec_bits.py
# resource hygiene: no lint cache left between runs
lint [fast]: for p in .venv/Scripts/python.exe .venv/bin/python; do [ -x "$p" ] && PY=$p && break; done; "${PY:-python}" -m ruff check --no-cache .
# resource hygiene: no pytest cache (pytest.ini), no server, no workers.
# "No tests collected" (exit 5) is red: the suite must never silently disappear (spec 0001).
test [fast]: for p in .venv/Scripts/python.exe .venv/bin/python; do [ -x "$p" ] && PY=$p && break; done; "${PY:-python}" -m pytest
