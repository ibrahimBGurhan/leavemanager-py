# Lint rules are pinned here so a ruff upgrade cannot silently change them (docs/conventions.md).
# Start: classic pyflakes + pycodestyle errors only — the legacy app.py is not drowned in findings.
# Tighten by adding rule sets in a spec/plan, not ad hoc.
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F"]
